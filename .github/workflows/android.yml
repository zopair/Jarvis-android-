name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional test prerelease tag (example: v0.1.0-test). Leave blank for CI only."
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict
          chmod +x gradlew
          ./gradlew --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android 17 SDK platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK and generate checksum
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish-test-prerelease:
    name: Publish verified test prerelease
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-test-release]'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository for GitHub CLI release context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: dist

      - name: Prepare release assets
        id: prepare_release
        shell: bash
        env:
          RAW_RELEASE_TAG: ${{ inputs.release_tag || 'v0.2.0-test' }}
        run: |
          # Normalize accidental whitespace or line breaks from the mobile form.
          RELEASE_TAG="$(printf '%s' "$RAW_RELEASE_TAG" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          echo "Requested test tag: [$RELEASE_TAG]"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-test([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid test tag. Use exactly v0.1.0-test (whitespace is ignored)." >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Jarvis-Android.apk
          rm -f dist/app-debug.apk.sha256
          (cd dist && sha256sum Jarvis-Android.apk > Jarvis-Android.apk.sha256)
          test -s dist/Jarvis-Android.apk
          test -s dist/Jarvis-Android.apk.sha256

      - name: Create GitHub test prerelease and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare_release.outputs.release_tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/Jarvis-Android.apk \
            dist/Jarvis-Android.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Jarvis Android $RELEASE_TAG" \
            --notes "TEST BUILD — Debug APK for device validation, not a stable production release. Built from commit $GITHUB_SHA. SHA-256 checksum is attached. Requires Android 8.0 (API 26) or newer. Download Jarvis-Android.apk, allow installation from this source if Android prompts, then install." \
            --prerelease \
            --latest=false
